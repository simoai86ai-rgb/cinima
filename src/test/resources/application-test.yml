spring:
  datasource:
    url: jdbc:h2:mem:cinema_one_${random.uuid};MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  flyway:
    enabled: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  thymeleaf:
    cache: false

app:
  site-base-url: http://localhost:8080
  demo-content:
    enabled: false
  bootstrap-admin:
    enabled: false
    reset-existing-password: false
