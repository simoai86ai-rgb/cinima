spring:
  application:
    name: cinema-one-platform
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cinema_one}
    username: ${DB_USERNAME:cinema_one}
    password: ${DB_PASSWORD:cinema_one_dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        default_batch_fetch_size: 50
  flyway:
    enabled: true
    locations: classpath:db/migration
  thymeleaf:
    cache: false

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
  error:
    whitelabel:
      enabled: false
    include-message: never
    include-stacktrace: never

app:
  site-base-url: ${SITE_BASE_URL:http://localhost:8080}
  demo-content:
    enabled: ${APP_DEMO_CONTENT_ENABLED:true}
  bootstrap-admin:
    enabled: ${APP_BOOTSTRAP_ADMIN_ENABLED:true}
    email: ${APP_ADMIN_EMAIL:admin@cinemaone.local}
    password: ${APP_ADMIN_PASSWORD:ChangeMe123!}
    display-name: ${APP_ADMIN_DISPLAY_NAME:Cinema One Admin}
    reset-existing-password: ${APP_ADMIN_RESET_PASSWORD:true}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
