<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Genres · Cinema One Admin</title><meta name="robots" content="noindex,nofollow,noarchive"><link rel="stylesheet" th:href="@{/assets/css/mock-styles.css}"><link rel="stylesheet" th:href="@{/assets/css/phase1.css}"></head>
<body class="admin-body"><div class="admin-shell"><aside th:replace="~{admin/fragments :: sidebar('genres')}"></aside><div class="admin-main"><header th:replace="~{admin/fragments :: topbar('Genres')}"></header><main class="admin-content">
<div class="admin-title"><div><div class="eyebrow">Taxonomy</div><h1>Genres</h1><p class="muted">Canonical genre slug with EN / FR / AR labels.</p></div></div><div th:if="${success}" class="alert alert-success" th:text="${success}"></div><div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
<div class="genre-admin-grid"><section class="table-card"><div class="card-head"><h3>Available genres</h3><span class="muted" th:text="${#lists.size(genres) + ' genres'}"></span></div><div class="genre-list" style="padding:16px"><div class="genre-row" th:each="genre : ${genres}"><div><div class="genre-names"><strong th:text="${genre.slug}">slug</strong><span class="locale-chip" th:each="translation : ${genre.translations}" th:text="${translation.locale + ': ' + translation.name}"></span></div></div><form th:action="@{/admin/genres/{id}/delete(id=${genre.id})}" method="post" data-confirm="Delete this genre?"><button class="btn btn-danger btn-sm" type="submit">Delete</button></form></div></div></section>
<section class="form-card"><h3>Add genre</h3><form th:object="${genreForm}" th:action="@{/admin/genres}" method="post"><div th:if="${#fields.hasGlobalErrors()}" class="alert alert-error"><div th:each="err : ${#fields.globalErrors()}" th:text="${err}"></div></div><div class="form-group"><label class="required">Slug</label><input class="input" th:field="*{slug}" placeholder="e.g. documentary"><div class="field-error" th:errors="*{slug}"></div></div><div class="form-group"><label class="required">English</label><input class="input" th:field="*{nameEn}"><div class="field-error" th:errors="*{nameEn}"></div></div><div class="form-group"><label class="required">Français</label><input class="input" th:field="*{nameFr}"><div class="field-error" th:errors="*{nameFr}"></div></div><div class="form-group"><label class="required">العربية</label><input class="input" dir="rtl" th:field="*{nameAr}"><div class="field-error" th:errors="*{nameAr}"></div></div><button class="btn btn-brand btn-block" type="submit">Create genre</button></form></section></div>
</main></div></div><nav th:replace="~{admin/fragments :: mobileNav('genres')}"></nav><script th:src="@{/assets/js/phase1.js}"></script></body></html>
