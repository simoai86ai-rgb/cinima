<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Movies · Cinema One Admin</title><meta name="robots" content="noindex,nofollow,noarchive">
<link rel="stylesheet" th:href="@{/assets/css/mock-styles.css}"><link rel="stylesheet" th:href="@{/assets/css/phase1.css}"></head>
<body class="admin-body"><div class="admin-shell"><aside th:replace="~{admin/fragments :: sidebar('movies')}"></aside><div class="admin-main"><header th:replace="~{admin/fragments :: topbar('Movie catalog')}"></header><main class="admin-content">
<div class="admin-title"><div><div class="eyebrow">Catalog</div><h1>Movies</h1><p class="muted">Search, edit, publish and archive catalog records.</p></div><a class="btn btn-brand" th:href="@{/admin/movies/new}">＋ Add movie</a></div>
<div th:if="${success}" class="alert alert-success" th:text="${success}"></div><div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
<form class="admin-toolbar" method="get" th:action="@{/admin/movies}"><div class="search-box"><span class="search-icon">⌕</span><input name="q" th:value="${q}" placeholder="Search original or translated title..."></div><button class="btn btn-soft" type="submit">Search</button><a class="btn btn-soft" th:if="${q != null and !q.isBlank()}" th:href="@{/admin/movies}">Clear</a></form>
<div class="table-card"><div th:if="${movies.totalElements == 0}" class="empty-state"><h3>No matching movies</h3><p th:text="${q == null or q.isBlank()} ? 'Your catalog is empty.' : 'Try another title or clear the search.'"></p><a class="btn btn-brand" th:href="@{/admin/movies/new}">Add movie</a></div>
<div th:unless="${movies.totalElements == 0}" style="overflow:auto"><table class="data-table"><thead><tr><th>Movie</th><th>Release</th><th>Status</th><th>Updated</th><th>Actions</th></tr></thead><tbody>
<tr th:each="movie : ${movies.content}"><td><strong th:text="${movie.originalTitle}">Movie</strong><div class="muted" style="font-size:.75rem" th:text="${movie.publicId}"></div></td><td th:text="${movie.releaseDate ?: '—'}">—</td><td><span class="status" th:classappend="${#strings.toLowerCase(movie.status.name())}" th:text="${movie.status}">DRAFT</span></td><td th:text="${#temporals.format(movie.updatedAt, 'yyyy-MM-dd HH:mm', 'UTC')}">date</td><td><div class="table-actions"><a class="btn btn-soft btn-sm" th:href="@{/admin/movies/{id}/edit(id=${movie.id})}">Edit</a><form th:if="${movie.status.name() != 'PUBLISHED'}" th:action="@{/admin/movies/{id}/publish(id=${movie.id})}" method="post"><button class="btn btn-brand btn-sm">Publish</button></form><form th:if="${movie.status.name() != 'ARCHIVED'}" th:action="@{/admin/movies/{id}/archive(id=${movie.id})}" method="post"><button class="btn btn-soft btn-sm">Archive</button></form></div></td></tr>
</tbody></table></div><div th:if="${movies.totalPages > 1}" class="admin-pagination"><a th:if="${movies.hasPrevious()}" th:href="@{/admin/movies(q=${q},page=${movies.number - 1})}">←</a><span class="active" th:text="${movies.number + 1}">1</span><span>/</span><span th:text="${movies.totalPages}">1</span><a th:if="${movies.hasNext()}" th:href="@{/admin/movies(q=${q},page=${movies.number + 1})}">→</a></div></div>
</main></div></div><nav th:replace="~{admin/fragments :: mobileNav('movies')}"></nav></body></html>
