<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" th:lang="${locale}" th:dir="${rtl ? 'rtl' : 'ltr'}"><head th:replace="~{public/fragments :: head(${seo})}"></head><body>
<header th:replace="~{public/fragments :: header(${activeNav})}"></header><nav th:replace="~{public/fragments :: mobileDrawer}"></nav><main><section class="page-hero"><div class="container"><div class="eyebrow" th:text="#{search.eyebrow}">Search</div><h1 th:text="#{search.title}">Find your next movie</h1><p th:text="#{search.copy}">Search catalog.</p><form class="toolbar" method="get" th:action="@{/{locale}/search(locale=${locale})}"><div class="search-box" style="max-width:720px"><span class="search-icon">⌕</span><input autofocus name="q" type="search" th:value="${q}" th:placeholder="#{search.placeholder}"></div><button class="btn btn-brand" type="submit" th:text="#{action.search}">Search</button></form></div></section>
<section class="section"><div class="container"><div class="movie-grid" th:if="${!#strings.isEmpty(q) and !catalogPage.movies.isEmpty()}"><th:block th:each="movie : ${catalogPage.movies}"><th:block th:replace="~{public/fragments :: movieCard(${movie}, null)}"></th:block></th:block></div><div class="empty-state" th:if="${#strings.isEmpty(q)}"><h3 th:text="#{search.emptyTitle}">Start with a title</h3><p th:text="#{search.emptyCopy}">Enter a title.</p></div><div class="empty-state" th:if="${!#strings.isEmpty(q) and catalogPage.movies.isEmpty()}"><h3 th:text="#{movies.emptyTitle}">No movies</h3><p th:text="#{movies.emptyCopy}">Try another title.</p></div><div class="pagination" th:if="${catalogPage.totalPages > 1}"><a th:classappend="${!catalogPage.hasPrevious} ? ' disabled'" th:href="@{/{locale}/search(locale=${locale},q=${q},page=${catalogPage.page - 1})}">‹</a><span class="active" th:text="${catalogPage.page + 1}">1</span><span th:text="${'/' + catalogPage.totalPages}">/3</span><a th:classappend="${!catalogPage.hasNext} ? ' disabled'" th:href="@{/{locale}/search(locale=${locale},q=${q},page=${catalogPage.page + 1})}">›</a></div></div></section></main><footer th:replace="~{public/fragments :: footer}"></footer><nav th:replace="~{public/fragments :: mobileTabs(${activeNav})}"></nav><script th:replace="~{public/fragments :: scripts}"></script></body></html>
