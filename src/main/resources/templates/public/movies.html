<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" th:lang="${locale}" th:dir="${rtl ? 'rtl' : 'ltr'}"><head th:replace="~{public/fragments :: head(${seo})}"></head><body>
<header th:replace="~{public/fragments :: header(${activeNav})}"></header><nav th:replace="~{public/fragments :: mobileDrawer}"></nav>
<main id="main-content"><section class="page-hero"><div class="container"><div class="eyebrow" th:text="#{movies.eyebrow}">Catalog</div><h1 th:text="#{movies.title}">All movies</h1><p th:text="#{movies.copy}">Browse catalog.</p>
<form class="toolbar" method="get" th:action="@{/{locale}/movies(locale=${locale})}"><div class="search-box"><span class="search-icon">⌕</span><input name="q" type="search" th:value="${q}" th:placeholder="#{movies.searchPlaceholder}"></div><select class="select" name="genre"><option value="" th:text="#{movies.allGenres}">All genres</option><option th:each="genre : ${genres}" th:value="${genre.slug}" th:selected="${genre.slug == selectedGenre}" th:text="${genre.name}">Genre</option></select><select class="select" name="year"><option value="" th:text="#{movies.anyYear}">Any year</option><option th:each="item : ${years}" th:value="${item}" th:selected="${selectedYear != null and item == selectedYear}" th:text="${item}">2026</option></select><button class="btn btn-brand" type="submit" th:text="#{action.search}">Search</button></form>
<div class="muted"><strong th:text="${catalogPage.totalElements}">10</strong> <span th:text="#{nav.movies}">movies</span></div></div></section>
<section class="section"><div class="container"><div class="movie-grid" th:if="${!catalogPage.movies.isEmpty()}"><th:block th:each="movie : ${catalogPage.movies}"><th:block th:replace="~{public/fragments :: movieCard(${movie}, null)}"></th:block></th:block></div><div class="empty-state" th:if="${catalogPage.movies.isEmpty()}"><h3 th:text="#{movies.emptyTitle}">No movies</h3><p th:text="#{movies.emptyCopy}">Try another filter.</p><a class="btn btn-soft" th:href="@{/{locale}/movies(locale=${locale})}" th:text="#{action.clear}">Clear</a></div>
<div class="pagination" th:if="${catalogPage.totalPages > 1}"><a th:classappend="${!catalogPage.hasPrevious} ? ' disabled'" th:href="@{/{locale}/movies(locale=${locale},q=${q},genre=${selectedGenre},year=${selectedYear},page=${catalogPage.page - 1})}">‹</a><span class="active" th:text="${catalogPage.page + 1}">1</span><span th:text="${'/' + catalogPage.totalPages}">/3</span><a th:classappend="${!catalogPage.hasNext} ? ' disabled'" th:href="@{/{locale}/movies(locale=${locale},q=${q},genre=${selectedGenre},year=${selectedYear},page=${catalogPage.page + 1})}">›</a></div></div></section></main>
<footer th:replace="~{public/fragments :: footer}"></footer><nav th:replace="~{public/fragments :: mobileTabs(${activeNav})}"></nav><script th:replace="~{public/fragments :: scripts}"></script></body></html>
