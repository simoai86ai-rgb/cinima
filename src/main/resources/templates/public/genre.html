<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" th:lang="${locale}" th:dir="${rtl ? 'rtl' : 'ltr'}"><head th:replace="~{public/fragments :: head(${seo})}"></head><body>
<header th:replace="~{public/fragments :: header(${activeNav})}"></header><nav th:replace="~{public/fragments :: mobileDrawer}"></nav><main><section class="page-hero"><div class="container"><div class="eyebrow" th:text="#{genres.eyebrow}">Genre</div><h1 th:text="${genre.name}">Genre</h1><p th:text="#{genre.results}">Published movies in this genre.</p></div></section><section class="section"><div class="container"><div class="movie-grid" th:if="${!catalogPage.movies.isEmpty()}"><th:block th:each="movie : ${catalogPage.movies}"><th:block th:replace="~{public/fragments :: movieCard(${movie}, null)}"></th:block></th:block></div><div class="empty-state" th:if="${catalogPage.movies.isEmpty()}"><h3 th:text="#{movies.emptyTitle}">No movies</h3><p th:text="#{movies.emptyCopy}">Try another genre.</p></div><div class="pagination" th:if="${catalogPage.totalPages > 1}"><a th:classappend="${!catalogPage.hasPrevious} ? ' disabled'" th:href="@{/{locale}/genre/{slug}(locale=${locale},slug=${genre.slug},page=${catalogPage.page - 1})}">‹</a><span class="active" th:text="${catalogPage.page + 1}">1</span><span th:text="${'/' + catalogPage.totalPages}">/3</span><a th:classappend="${!catalogPage.hasNext} ? ' disabled'" th:href="@{/{locale}/genre/{slug}(locale=${locale},slug=${genre.slug},page=${catalogPage.page + 1})}">›</a></div></div></section></main><footer th:replace="~{public/fragments :: footer}"></footer><nav th:replace="~{public/fragments :: mobileTabs(${activeNav})}"></nav><script th:replace="~{public/fragments :: scripts}"></script></body></html>
