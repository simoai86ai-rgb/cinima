<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" th:lang="${locale}" th:dir="${rtl ? 'rtl' : 'ltr'}"><head th:replace="~{public/fragments :: head(${seo})}"></head><body>
<header th:replace="~{public/fragments :: header(${activeNav})}"></header><nav th:replace="~{public/fragments :: mobileDrawer}"></nav><main>
<section class="details-hero"><img class="details-bg-image" th:src="${movie.backdropUrl}" alt="" aria-hidden="true"><div class="container details-wrap"><div class="breadcrumbs"><a th:href="@{/{locale}(locale=${locale})}" th:text="#{nav.home}">Home</a><span class="sep">›</span><a th:href="@{/{locale}/movies(locale=${locale})}" th:text="#{nav.movies}">Movies</a><span class="sep">›</span><span th:text="${movie.title}">Movie</span></div><div class="details-inner"><div class="details-poster"><img th:src="${movie.posterUrl}" th:alt="${movie.title + ' poster'}" width="400" height="600"></div><div class="details-copy"><div class="eyebrow" th:text="${movie.genres.isEmpty() ? 'Cinema One' : movie.genres.get(0).name}">Genre</div><h1 th:text="${movie.title}">Movie title</h1><div class="meta-row"><span class="rating" th:text="${'★ ' + movie.ratingLabel}">★ 8.5</span><span class="meta-dot"></span><span th:text="${movie.year}">2026</span><span class="meta-dot"></span><span th:text="${movie.runtimeLabel}">2h</span><span th:if="${!movie.genres.isEmpty()}" class="meta-dot"></span><span th:if="${!movie.genres.isEmpty()}" th:text="${movie.genres.get(0).name}">Genre</span></div><p class="details-description" th:text="${movie.shortDescription}">Description</p><div class="details-actions"><a class="btn btn-primary" th:href="${movie.watchUrl}" >▶ <span th:text="#{action.watch}">Watch in app</span></a></div></div></div></div></section>
<section class="section-lg"><div class="container info-grid"><div><div class="panel"><h3 th:text="#{movie.storyline}">Storyline</h3><p class="muted" th:text="${movie.description}">Storyline.</p><div class="fact-list" style="margin-top:25px"><div class="fact"><span th:text="#{movie.releaseYear}">Release year</span><strong th:text="${movie.year}">2026</strong></div><div class="fact"><span th:text="#{movie.runtime}">Runtime</span><strong th:text="${movie.runtimeLabel}">2h</strong></div><div class="fact"><span th:text="#{movie.genre}">Genre</span><strong><span th:each="genre,stat : ${movie.genres}" th:text="${genre.name + (stat.last ? '' : ' · ')}">Genre</span></strong></div><div class="fact"><span th:text="#{movie.originalLanguage}">Original language</span><strong th:text="${movie.originalLanguage}">en</strong></div></div></div></div><aside><div class="panel"><h3 th:text="#{movie.details}">Details</h3><div class="fact" style="margin-bottom:17px"><span>ID</span><strong th:text="${movie.publicId}">UUID</strong></div><div class="fact"><span>SEO</span><strong>SSR · hreflang · JSON-LD</strong></div></div></aside></div></section>
<section class="section" th:if="${!relatedMovies.isEmpty()}" data-rail-wrap><div class="container"><div class="section-head"><div><h2 th:text="#{movie.related}">You may also like</h2><p class="muted" th:text="#{movie.relatedCopy}">Similar movies.</p></div><div class="rail-nav"><button class="rail-btn" type="button" data-rail-prev aria-label="Previous movies">‹</button><button class="rail-btn" type="button" data-rail-next aria-label="Next movies">›</button></div></div><div class="movie-grid movie-rail"><th:block th:each="related : ${relatedMovies}"><th:block th:replace="~{public/fragments :: movieCard(${related}, null)}"></th:block></th:block></div></div></section>
</main><footer th:replace="~{public/fragments :: footer}"></footer><nav th:replace="~{public/fragments :: mobileTabs(${activeNav})}"></nav><script th:replace="~{public/fragments :: scripts}"></script></body></html>
