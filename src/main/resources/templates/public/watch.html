<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" th:lang="${locale}" th:dir="${rtl ? 'rtl' : 'ltr'}"><head th:replace="~{public/fragments :: head(${seo})}"></head><body>
<header th:replace="~{public/fragments :: header(${activeNav})}"></header><nav th:replace="~{public/fragments :: mobileDrawer}"></nav><main><section class="page-hero" style="min-height:72vh;display:grid;align-items:center"><div class="container"><div class="watch-panel"><img class="watch-poster" th:src="${movie.posterUrl}" th:alt="${movie.title + ' poster'}"><div class="watch-status" th:text="#{watch.eyebrow}">Android playback</div><h1 th:text="#{watch.title}">Playback arrives in Phase 3</h1><p class="muted" style="font-size:1.05rem;line-height:1.8" th:text="#{watch.copy}">Phase 3 will connect this route.</p><div class="hero-actions" style="justify-content:center"><a class="btn btn-brand" th:href="${movie.detailUrl}" th:text="#{watch.return}">Return</a></div></div></div></section></main><footer th:replace="~{public/fragments :: footer}"></footer><nav th:replace="~{public/fragments :: mobileTabs(${activeNav})}"></nav><script th:replace="~{public/fragments :: scripts}"></script></body></html>
