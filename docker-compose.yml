services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cinema_one}
      POSTGRES_USER: ${POSTGRES_USER:-cinema_one}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cinema_one_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - cinema_one_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cinema_one} -d ${POSTGRES_DB:-cinema_one}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cinema_one_pgdata:
