name: CI - Pull requests

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: cinema-one-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: Maven package without tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Java 21
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build application without compiling or running tests
        run: mvn -B -ntp clean package -Dmaven.test.skip=true
