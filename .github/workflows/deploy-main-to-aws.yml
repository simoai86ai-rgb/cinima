name: CI/CD - Deploy main to AWS EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: cinema-one-production
  cancel-in-progress: false

jobs:
  verify-build-deploy:
    name: Build image and deploy
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 35

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      RUNTIME_ENV_PARAMETER: ${{ vars.SSM_RUNTIME_ENV_PARAMETER }}
      DEPLOY_DIR: /opt/cinema-one

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Validate deployment variables
        shell: bash
        run: |
          set -Eeuo pipefail
          missing=0
          for name in AWS_REGION AWS_ROLE_ARN ECR_REPOSITORY EC2_INSTANCE_ID RUNTIME_ENV_PARAMETER; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing GitHub Environment variable: ${name}"
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi

      - name: Set up Java 21
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build application without compiling or running tests
        run: mvn -B -ntp clean package -Dmaven.test.skip=true

      - name: Configure short-lived AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: cinema-one-${{ github.run_id }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2.1.6

      - name: Build and push immutable Docker image
        id: image
        shell: bash
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          set -Eeuo pipefail
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}"
          LATEST_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:latest"

          docker build --pull \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            -t "$IMAGE_URI" \
            -t "$LATEST_URI" \
            .

          docker push "$IMAGE_URI"
          docker push "$LATEST_URI"
          echo "uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      - name: Deploy release to EC2 with AWS Systems Manager
        shell: bash
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_URI: ${{ steps.image.outputs.uri }}
        run: |
          set -Eeuo pipefail

          SCRIPT_B64="$(base64 -w 0 deploy/aws/deploy-release.sh)"
          PARAMS_FILE="$(mktemp)"

          python3 - "$PARAMS_FILE" "$SCRIPT_B64" "$DEPLOY_DIR" "$AWS_REGION" "$ECR_REGISTRY" "$IMAGE_URI" "$RUNTIME_ENV_PARAMETER" <<'PY'
          import json
          import shlex
          import sys

          output, script_b64, deploy_dir, region, registry, image_uri, parameter = sys.argv[1:]
          script_path = f"{deploy_dir}/deploy-release.sh"
          commands = [
              "set -Eeuo pipefail",
              f"sudo mkdir -p {shlex.quote(deploy_dir)}",
              f"echo {shlex.quote(script_b64)} | base64 -d | sudo tee {shlex.quote(script_path)} >/dev/null",
              f"sudo chmod 755 {shlex.quote(script_path)}",
              "sudo env "
              + f"AWS_REGION={shlex.quote(region)} "
              + f"ECR_REGISTRY={shlex.quote(registry)} "
              + f"IMAGE_URI={shlex.quote(image_uri)} "
              + f"RUNTIME_ENV_PARAMETER={shlex.quote(parameter)} "
              + f"APP_DIR={shlex.quote(deploy_dir)} "
              + shlex.quote(script_path),
          ]
          with open(output, "w", encoding="utf-8") as fh:
              json.dump({"commands": commands}, fh)
          PY

          COMMAND_ID="$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Cinema One ${GITHUB_SHA}" \
            --timeout-seconds 900 \
            --parameters "file://${PARAMS_FILE}" \
            --query 'Command.CommandId' \
            --output text)"

          echo "SSM command: $COMMAND_ID"
          set +e
          aws ssm wait command-executed \
            --region "$AWS_REGION" \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID"
          WAIT_EXIT=$?
          set -e

          INVOCATION_FILE="$(mktemp)"
          aws ssm get-command-invocation \
            --region "$AWS_REGION" \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --output json > "$INVOCATION_FILE" || true

          python3 - "$INVOCATION_FILE" <<'PY'
          import json
          import sys
          from pathlib import Path
          p = Path(sys.argv[1])
          if not p.exists() or not p.read_text().strip():
              print("No SSM invocation output was returned.")
              raise SystemExit(0)
          data = json.loads(p.read_text())
          print("Deployment status:", data.get("Status", "Unknown"))
          stdout = data.get("StandardOutputContent", "").strip()
          stderr = data.get("StandardErrorContent", "").strip()
          if stdout:
              print("--- remote stdout ---")
              print(stdout)
          if stderr:
              print("--- remote stderr ---")
              print(stderr)
          PY

          STATUS="$(aws ssm get-command-invocation \
            --region "$AWS_REGION" \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query 'Status' \
            --output text 2>/dev/null || echo Unknown)"

          if [[ "$WAIT_EXIT" -ne 0 || "$STATUS" != "Success" ]]; then
            echo "::error::AWS deployment failed with SSM status: $STATUS"
            exit 1
          fi

      - name: Optional public health check
        if: ${{ vars.PUBLIC_HEALTH_URL != '' }}
        env:
          PUBLIC_HEALTH_URL: ${{ vars.PUBLIC_HEALTH_URL }}
        run: |
          curl --fail --silent --show-error \
            --retry 12 --retry-delay 5 --retry-all-errors \
            "$PUBLIC_HEALTH_URL"
